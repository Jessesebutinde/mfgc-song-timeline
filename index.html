<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171E33">
<meta name="mobile-web-app-capable" content="yes">
<title>MFGC Song Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap">
<style>
:root{
  --ink:#171E33;--panel:#212A45;--raise:#2B3656;--line:#3A4668;
  --amber:#F2B544;--amber2:#FFD27A;--text:#F4EFE4;--mute:#97A1C1;--dim:#6B7596;
  --danger:#FF8A8A;--ok:#7DE2A8;
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --top:56px;--cut:118px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--ink)}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.35;font-optical-sizing:auto;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input,textarea{width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--text);min-height:46px}
input::placeholder,textarea::placeholder{color:var(--dim)}
input:focus,textarea:focus{outline:none;border-color:var(--amber)}
textarea{resize:vertical;line-height:1.45}
.btn{min-height:44px;padding:0 14px;border-radius:12px;background:var(--raise);color:var(--text);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,background .15s,color .15s;white-space:nowrap}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--amber);color:#1c1503}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.5px rgba(255,138,138,.4)}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.ib{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:22px;color:var(--text);flex:none}
.ib:active{background:var(--raise)}
.hide{display:none!important}

/* Top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;height:calc(var(--top) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0;background:rgba(23,30,51,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(58,70,104,.6)}
.top .tt{flex:1;min-width:0;line-height:1.15}
.top .tt b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tt small{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--panel);font-size:13px;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);opacity:0;transition:opacity .3s}
.pill.saved i{opacity:1}

/* Views */
.view{display:none}
.view.on{display:block}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

/* Home */
.hero{padding:26px 0 10px}
.hero h1{font-size:34px;line-height:1.02;letter-spacing:-.025em;font-weight:800;margin:0 0 10px;font-variation-settings:"opsz" 96}
.hero p{margin:0 0 16px;color:var(--mute);max-width:36ch;font-size:16.5px}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 6px}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.stats span{font-size:13px;color:var(--mute)}
.bar{height:8px;border-radius:4px;background:var(--panel);overflow:hidden;margin:14px 0 24px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--amber2));border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.wallh{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px}
.wallh h2{font-size:15px;color:var(--mute);font-weight:600;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:34px;padding:0 12px;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);font-size:14px;font-weight:600;color:var(--mute);display:inline-flex;align-items:center;transition:background .15s,color .15s}
.chip.on{background:var(--text);color:#171e33;box-shadow:none}
.wall{display:flex;flex-direction:column;gap:4px;padding-bottom:90px}
.sunrow{display:grid;grid-template-columns:84px 1fr 44px;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 8px;border-radius:12px;transition:background .15s}
.sunrow:active{background:var(--panel)}
.sunrow .sd{line-height:1.1}
.sunrow .sd b{display:block;font-size:14.5px;font-weight:700}
.sunrow .sd small{font-size:12px;color:var(--dim)}
.sunrow .sc{text-align:right;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.sunrow.done .sc{color:var(--ok)}
.strip{display:flex;height:22px;gap:2px;width:100%}
.strip i{display:block;height:100%;border-radius:4px;background:var(--c);min-width:2px}
.strip i.un{background:repeating-linear-gradient(135deg,#3b466a 0 5px,#2f3a5a 5px 10px)}
.strip i.nosong{background:#2a3147}

/* Songs tab */
.search{position:sticky;top:calc(var(--top) + env(safe-area-inset-top));z-index:10;background:var(--ink);padding:10px 0 8px}
.search input{border-radius:14px}
.search .chips{margin-top:8px}
.songs{padding-bottom:90px}
.srow{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 6px 10px 4px;border-bottom:1px solid rgba(255,255,255,.06);min-height:64px;border-radius:10px}
.srow:active{background:var(--panel)}
.srow .cbar{width:6px;align-self:stretch;border-radius:3px;background:var(--c)}
.srow .cbar.un{background:repeating-linear-gradient(135deg,#3b466a 0 5px,#2f3a5a 5px 10px)}
.srow .cbar.nosong{background:#2a3147}
.srow .st{min-width:0}
.srow .st b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .st b.un{color:var(--mute);font-weight:500;font-style:italic}
.srow .st small{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sm{text-align:right;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;line-height:1.3}
.srow.cur{background:rgba(242,181,68,.08)}
.srow.cur .cbar{box-shadow:0 0 0 2px var(--amber)}
.empty{padding:40px 10px;color:var(--mute);text-align:center}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(23,30,51,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(58,70,104,.6)}
.nav button{flex:1;max-width:220px;min-height:46px;border-radius:12px;font-weight:600;color:var(--mute);font-size:15px}
.nav button.on{background:var(--panel);color:var(--text)}

/* Studio */
#vStudio.on{display:block}
.sh{display:none}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
#vStudio{background:var(--ink)}
.player iframe,.player #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.perr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0f1424;color:var(--mute);padding:20px;text-align:center}
.transport{position:sticky;top:calc(var(--top) + env(safe-area-inset-top));z-index:20;background:rgba(15,20,36,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:8px 12px 10px;border-bottom:1px solid rgba(58,70,104,.6)}
.clock{display:flex;align-items:baseline;gap:8px;margin:0 0 8px;min-height:34px}
.clock b{font-size:36px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;color:var(--amber2)}
.clock span{color:var(--mute);font-size:15px;font-variant-numeric:tabular-nums}
.clock .rate{margin-left:auto;min-height:34px;padding:0 12px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;font-size:14px;color:var(--text)}
.clock .rate.fast{background:var(--text);color:#171e33;box-shadow:none}
.skips{display:grid;grid-template-columns:repeat(4,1fr) 58px repeat(4,1fr);gap:4px}
.skips button{min-height:44px;border-radius:10px;background:var(--panel);font-size:13px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;padding:0 2px;transition:transform .1s,background .15s}
.skips button:active{transform:scale(.93);background:var(--raise)}
.skips .pp{background:var(--amber);color:#1c1503;font-size:20px;border-radius:12px}
.skips .pp.playing{background:var(--amber2)}
.work{padding-bottom:calc(var(--cut) + 24px + env(safe-area-inset-bottom))}
.tlhead{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 4px}
.tlhead h2{margin:0;font-size:14px;font-weight:600;color:var(--mute)}
.zoom{display:flex;gap:3px;background:var(--panel);padding:3px;border-radius:10px}
.zoom button{min-height:30px;padding:0 9px;border-radius:8px;font-size:13px;font-weight:700;color:var(--mute)}
.zoom button.on{background:var(--text);color:#171e33}
.tl{padding:4px 12px 10px;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.row{display:grid;grid-template-columns:46px 1fr;align-items:center;gap:6px;height:42px}
.rlab{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;text-align:right;padding-right:2px}
.lane{position:relative;height:32px;background:var(--panel);border-radius:8px}
.lane.tail{background:repeating-linear-gradient(90deg,var(--panel) 0 6px,transparent 6px 12px);opacity:.55}
.tick{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.07);pointer-events:none}
.tick.big{background:rgba(255,255,255,.14)}
.seg{position:absolute;top:3px;bottom:3px;border-radius:7px;background:var(--c);display:flex;align-items:center;padding:0 7px;font-size:12.5px;font-weight:700;color:#141a2a;overflow:hidden;transition:filter .15s,box-shadow .2s}
.seg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.un{background:repeating-linear-gradient(135deg,#3f4a6e 0 6px,#303b5c 6px 12px);color:var(--mute)}
.seg.nosong{background:#2a3147;color:var(--dim)}
.seg.cl{border-top-left-radius:0;border-bottom-left-radius:0}
.seg.cr{border-top-right-radius:0;border-bottom-right-radius:0}
.seg.cur{box-shadow:0 0 0 2px var(--amber2),0 0 16px rgba(242,181,68,.45);z-index:2}
.seg.flash{animation:flash .9s ease-out}
@keyframes flash{0%{filter:brightness(2.2)}100%{filter:brightness(1)}}
.ph{position:absolute;top:-7px;bottom:-7px;width:2px;margin-left:-1px;background:var(--amber);box-shadow:0 0 10px var(--amber);pointer-events:none;z-index:6;transition:left .2s linear}
.ph::before{content:"";position:absolute;top:-4px;left:-5px;width:12px;height:12px;border-radius:50%;background:var(--amber)}
.ph::after{content:"";position:absolute;bottom:-4px;left:-5px;width:12px;height:12px;border-radius:50%;background:var(--amber)}
.tl.scrub .ph{transition:none}
.ph .bub{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-8px);background:var(--amber);color:#1c1503;font-weight:800;font-size:14px;padding:4px 9px;border-radius:8px;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .15s;white-space:nowrap}
.tl.scrub .ph .bub{opacity:1}

/* Current song card */
.card{margin:6px 12px 14px;background:var(--panel);border-radius:16px;padding:14px;border-left:6px solid var(--c,var(--line))}
.card .ch{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.card .ch b{font-size:20px;font-weight:800;letter-spacing:-.01em}
.card .ch b.un{color:var(--mute);font-weight:500;font-style:italic}
.card .ch span{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.card q{display:block;color:var(--text);font-style:italic;margin:4px 0 8px;font-size:15px;quotes:"“" "”"}
.card .why{font-size:13px;color:var(--dim);margin:0 0 10px}
.card .chips{margin:0 0 10px}
.chip.l{box-shadow:inset 0 0 0 1.5px var(--line)}
.chip.l.on{background:var(--amber);color:#1c1503}
.fine{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;margin:4px 0 10px}
.fine label{font-size:13px;color:var(--mute)}
.tr{display:grid;grid-template-columns:44px 44px 1fr 44px 44px;gap:4px}
.tr button{min-height:40px;border-radius:9px;background:var(--raise);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.tr input{min-height:40px;padding:0 6px;text-align:center;font-variant-numeric:tabular-nums;border-radius:9px}
.card details{margin-top:6px}
.card summary{cursor:pointer;min-height:40px;display:flex;align-items:center;font-weight:600;color:var(--mute);list-style:none}
.card summary::-webkit-details-marker{display:none}
.card summary::before{content:"+";display:inline-block;width:22px;font-size:20px;color:var(--amber)}
.card details[open] summary::before{content:"–"}
.card .heard{white-space:pre-wrap;font-size:14px;color:var(--mute);line-height:1.5;background:var(--ink);border-radius:10px;padding:10px 12px;margin:6px 0 0}
.card .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.card .acts .btn{flex:1 1 auto}
.lh{display:flex;align-items:center;justify-content:space-between;padding:4px 14px 6px;color:var(--mute);font-size:14px;font-weight:600}
.list{list-style:none;margin:0;padding:0 8px}
.list .srow{grid-template-columns:6px 34px 1fr auto}
.list .srow .n{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;font-weight:700}
.list .srow.cur .n{color:var(--amber)}

/* Cut bar */
.cutbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(23,30,51,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(58,70,104,.7)}
.cb1{display:grid;grid-template-columns:auto auto 1fr 44px;align-items:center;gap:8px;margin:0 0 8px}
.cb1 .pos{padding:0;min-height:30px}
.cb1 .dot{width:14px;height:14px;border-radius:50%;background:var(--c,var(--line));box-shadow:0 0 10px var(--c,transparent)}
.cb1 .pos{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.cb1 input{min-height:44px;border-radius:12px;padding:8px 12px;font-weight:600}
.cb2{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:6px}
.cb2 .btn{padding:0 6px;font-size:14.5px}
.cb2 .btn.primary{font-size:16px}

/* Toast, sheet */
.toast{position:fixed;left:50%;bottom:calc(var(--cut) + 14px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--text);color:#171e33;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14.5px;opacity:0;transition:opacity .2s,transform .2s;z-index:40;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
body.home .toast{bottom:calc(76px + env(safe-area-inset-bottom))}
.undo{color:var(--dim);font-size:24px;transition:color .2s,transform .15s}
.undo.on{color:var(--amber)}
.undo:active{transform:rotate(-30deg)}
.sheetbg{position:fixed;inset:0;background:rgba(5,8,18,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.sheetbg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--panel);border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet p{margin:0 0 12px;color:var(--mute);font-size:14px}
.sheet .btn{width:100%;justify-content:flex-start;margin:0 0 8px;padding:0 14px;min-height:48px}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet .note{font-size:12.5px;color:var(--dim);margin:6px 0 0}

/* Landscape studio: player left, work right */
@media (orientation:landscape) and (max-height:620px){
  body.studio .top{display:none}
  #vStudio.on{display:grid;grid-template-columns:minmax(300px,44%) 1fr;grid-template-rows:auto minmax(0,1fr) auto;height:100dvh;height:100vh}
  .sh{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 2px;grid-area:1/1;border-right:1px solid var(--line)}
  .player{grid-area:2/1;aspect-ratio:auto;min-height:0;border-right:1px solid var(--line)}
  .transport{grid-area:3/1;position:static;align-self:end;padding:6px 10px 8px;border-right:1px solid var(--line);border-bottom:0}
  .work{grid-area:1/2/3/3;overflow:auto;min-height:0;padding-bottom:12px}
  .cutbar{grid-area:3/2;position:static;border-top:1px solid var(--line)}
  .sh .tt{flex:1;min-width:0;line-height:1.1}
  .sh .tt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sh .tt small{font-size:11.5px;color:var(--mute)}
  .clock b{font-size:28px}
  .skips button{min-height:38px;font-size:12px}
  .toast{bottom:16px;left:auto;right:16px;transform:translate(0,10px)}
  .toast.on{transform:none}
}
@media (min-width:760px) and (min-height:621px){
  .player,.transport,.work,.cutbar{max-width:760px;margin:0 auto}
  .cutbar{left:50%;transform:translateX(-50%);width:100%;border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="home">

<header class="top" id="top">
  <button class="ib hide" id="back" aria-label="Back to Sundays">‹</button>
  <div class="tt"><b id="t1">MFGC Song Timeline</b><small id="t2">Makerere Full Gospel Church</small></div>
  <div class="pill" id="prog"><i></i><span id="progT">…</span></div>
  <button class="ib" id="menu" aria-label="More">⋮</button>
</header>

<main id="vHome" class="view on">
  <div class="wrap">
    <section class="hero">
      <h1>Every Sunday, one song at a time</h1>
      <p>Worship from Makerere Full Gospel Church, cut into its songs. Tap a Sunday to play it and fix the cuts.</p>
      <div class="stats" id="stats"></div>
      <div class="bar"><i id="barFill"></i></div>
    </section>
    <div class="wallh"><h2>Sundays</h2><div class="chips" id="wallFilter"><button class="chip on" data-f="all">All</button><button class="chip" data-f="todo">Still to name</button></div></div>
    <div class="wall" id="wall"></div>
  </div>
</main>

<main id="vSongs" class="view">
  <div class="wrap">
    <div class="search">
      <input id="q" type="search" placeholder="Search song names, lyrics, first lines" autocomplete="off">
      <div class="chips" id="songFilter">
        <button class="chip on" data-f="all">All</button>
        <button class="chip" data-f="named">Named</button>
        <button class="chip" data-f="un">Unnamed</button>
        <button class="chip" data-f="Luganda">Luganda</button>
        <button class="chip" data-f="English">English</button>
      </div>
    </div>
    <div class="songs" id="songs"></div>
  </div>
</main>

<main id="vStudio" class="view">
    <div class="sh"><button class="ib" id="back2" aria-label="Back">‹</button><div class="tt"><b id="t1b"></b><small id="t2b"></small></div><button class="ib" id="menu2" aria-label="More">⋮</button></div>
    <div class="player"><div id="yt"></div><div class="perr hide" id="perr"></div></div>
    <div class="transport">
      <div class="clock"><b id="now">00:00</b><span id="dur">/ 00:00</span><button class="rate" id="rate">1×</button></div>
      <div class="skips">
        <button data-d="-120">−2m</button><button data-d="-60">−1m</button><button data-d="-10">−10s</button><button data-d="-1">−1s</button>

function startTick(){if(tickT)return;tickT=setInterval(()=>{if(view!='studio'||!player||!ready||scrubbing)return;try{const t=player.getCurrentTime();if(typeof t=='number'&&!isNaN(t)){T=t;paint()}}catch(e){}},200)}
function seek(t,play=true){T=Math.max(0,t);
 if(player&&ready){try{player.seekTo(T,true);if(play&&!playing)player.playVideo()}catch(e){}}else pending={t:T,play};paint()}
function togglePlay(){if(!player||!ready)return;try{playing?player.pauseVideo():player.playVideo()}catch(e){}}
$('#pp').onclick=togglePlay;
$$('.skips [data-d]').forEach(b=>b.onclick=()=>seek(T+ +b.dataset.d,playing));
$('#rate').onclick=()=>{const R=[1,1.25,1.5,2];rate=R[(R.indexOf(rate)+1)%R.length];$('#rate').textContent=rate+'×';$('#rate').classList.toggle('fast',rate!=1);try{player&&player.setPlaybackRate(rate)}catch(e){}};

/* ========= Studio ========= */
let rowSec=300,scrubbing=false,lastCurId=null,cbFor=null,cardFor=null,cardStale=false;
function openStudio(d,t,autoplay){cur={d};recompute();go('studio');
 $('#t1').textContent=$('#t1b').textContent=DF(d)+' '+YR(d);
 mountPlayer(vidOf(d),t||0,!!autoplay);T=t||0;lastCurId=null;
 buildTL();buildCard(true);buildList();paint();window.scrollTo(0,0);$('.work').scrollTop=0}
function recompute(){cur.rows=rowsOf(cur.d);cur.end=cur.rows[cur.rows.length-1].e}
function refresh(){recompute();lastCurId=null;buildTL();buildCard(true);buildList();paint();}
function curSec(){const rs=cur.rows;return rs.find(r=>T>=r.s&&T<r.e)||(T>=rs[rs.length-1].e?rs[rs.length-1]:rs[0])}
function span(){return rowSec||Math.max(60,cur.end)}
function tlEnd(){return Math.max(cur.end,T)+(rowSec?Math.min(rowSec,120):0)}
$$('#zoom button').forEach(b=>b.onclick=()=>{rowSec=+b.dataset.z;$$('#zoom button').forEach(x=>x.classList.toggle('on',x==b));buildTL();paint()});
const ph=h('div',{class:'ph'},h('span',{class:'bub'}));
function buildTL(){const tl=$('#tl');tl.replaceChildren();const sp=span(),end=tlEnd(),n=Math.max(1,Math.ceil(end/sp)),laneW=Math.max(120,tl.clientWidth-76);
 const tick=sp>=1200?300:sp>=600?60:sp>=120?30:10;
 for(let i=0;i<n;i++){const r0=i*sp;const lane=h('div',{class:'lane'+(r0>=cur.end?' tail':'')});
  for(let t=tick;t<sp;t+=tick)lane.append(h('i',{class:'tick'+(t%60==0?' big':''),style:'left:'+(t/sp*100)+'%'}));
  cur.rows.forEach(r=>{const a=Math.max(r.s,r0),b=Math.min(r.e,r0+sp);if(b<=a)return;
   const seg=h('div',{class:'seg '+segClass(r)+(r.s<r0?' cl':'')+(r.e>r0+sp?' cr':''),'data-id':r.id,style:'--c:'+gel(r.i)+';left:'+((a-r0)/sp*100)+'%;width:'+((b-a)/sp*100)+'%'},h('span',{text:(b-a)/sp*laneW<30?'':title(r)||(isNoSong(r)?'—':'#'+r.n)}));
   lane.append(seg)});
  tl.append(h('div',{class:'row','data-s':r0},h('span',{class:'rlab',text:fmt(r0)}),lane))}}
function paint(){if(!cur)return;$('#now').textContent=fmt(T);$('#dur').textContent='/ '+fmt(cur.end);
 const sp=span(),i=Math.floor(T/sp),rows=$$('#tl .row');let row=rows[i];
 if(!row){if(T>tlEnd()-1){buildTL();return paint()}row=rows[rows.length-1]}
 const lane=row.querySelector('.lane');if(ph.parentNode!=lane)lane.append(ph);
 ph.style.left=((T-i*sp)/sp*100)+'%';ph.querySelector('.bub').textContent=fmt(T);
 const c=curSec();if(c.id!=lastCurId){lastCurId=c.id;$$('#tl .seg').forEach(s=>s.classList.toggle('cur',s.dataset.id==c.id));
  $$('#list .srow').forEach(s=>s.classList.toggle('cur',s.dataset.id==c.id));if($('#card').contains(document.activeElement))cardStale=true;else buildCard(false);
  const li=$('#list .srow.cur');if(li&&playing&&!scrubbing)li.scrollIntoView({block:'nearest',behavior:'smooth'})}
 const cbr=(document.activeElement==$('#cbTitle')&&cur.rows.find(x=>x.id==cbFor))||c;$('#cbPos').textContent='#'+cbr.n+'  '+fmt(cbr.s)+'–'+fmt(cbr.e)}

/* Scrub / tap the timeline */
const tl=$('#tl');
function scrubTo(e){const el=document.elementFromPoint(e.clientX,e.clientY);let row=el&&el.closest('.row');
 if(!row){const rows=$$('#tl .row');row=rows.reduce((b,r)=>{const d=Math.abs(r.getBoundingClientRect().top+21-e.clientY);return !b||d<b.d?{r,d}:b},null).r}
 const lane=row.querySelector('.lane'),b=lane.getBoundingClientRect(),x=Math.min(Math.max(0,e.clientX-b.left),b.width);T=+row.dataset.s+x/b.width*span();paint()}
tl.addEventListener('pointerdown',e=>{if(e.button)return;const row=e.target.closest('.row');if(!row)return;scrubbing=true;tl.classList.add('scrub');tl.setPointerCapture(e.pointerId);scrubTo(e)});
tl.addEventListener('pointermove',e=>{if(scrubbing)scrubTo(e)});
tl.addEventListener('pointerup',e=>{if(!scrubbing)return;scrubbing=false;tl.classList.remove('scrub');scrubTo(e);seek(T,true)});
tl.addEventListener('pointercancel',()=>{scrubbing=false;tl.classList.remove('scrub');paint()});

/* ---- Cut actions (shared validation) ---- */
function setStart(r,t){t=Math.round(t);const rs=cur.rows,i=rs.indexOf(r),prev=rs[i-1];
 if(prev&&t<=prev.s)return toast('Start cannot be before #'+prev.n+' starts ('+fmt(prev.s)+')');
 if(t>=r.e)return toast('Start must be before the end ('+fmt(r.e)+')');if(t<0)return;
 snap();sd(cur.d).mv[r.id]=t;saveS();flashSaved();refresh();flashSeg(r.id);toast('#'+r.n+' now starts at '+fmt(t));return true}
function setEnd(r,t){t=Math.round(t);const nx=r.next;
 if(t<=r.s)return toast('End must be after the start ('+fmt(r.s)+')');
 if(nx&&t>=nx.e)return toast('End cannot pass where #'+(r.n+1)+' ends ('+fmt(nx.e)+')');
 snap();if(nx)sd(cur.d).mv[nx.id]=t;else sd(cur.d).end=t;saveS();flashSaved();refresh();flashSeg(r.id);toast('#'+r.n+' now ends at '+fmt(t));return true}
function cutAt(t){const r=curSec();t=Math.round(t);if(t<=r.s||t>=r.e)return toast('Move inside a song, then cut');
 if(t-r.s<2||r.e-t<2)return toast('Too close to the edge to cut');
 snap();const id=cur.d+'#u'+Date.now();sd(cur.d).add.push({id,t});const src=E[r.id]||{};E[id]={language:src.language||'',type:src.type||''};save();saveS();refresh();flashSeg(id);
 toast('Cut at '+fmt(t)+' — type the new song’s name');$('#cbTitle').focus({preventScroll:true})}
function flashSeg(id){$$('#tl .seg[data-id="'+id+'"]').forEach(s=>{s.classList.add('flash');setTimeout(()=>s.classList.remove('flash'),900)})}
$('#bCut').onclick=()=>cutAt(T);
$('#bStart').onclick=()=>setStart(curSec(),T);
$('#bEnd').onclick=()=>setEnd(curSec(),T);
$('#cbTitle').oninput=()=>{const r=cur.rows.find(x=>x.id==cbFor)||curSec();setv(r,'title',$('#cbTitle').value);liveTitle(r)};
$('#cbTitle').onblur=()=>{setTimeout(()=>{if(cur&&view=='studio')buildCard(false)},50)};
$('#cbPos').onclick=()=>{const r=cur.rows.find(x=>x.id==cbFor)||curSec();seek(r.s,true)};
$('#card').addEventListener('focusout',()=>setTimeout(()=>{if(cardStale&&!$('#card').contains(document.activeElement)){cardStale=false;buildCard(false)}},60));
function liveTitle(r){const t=title(r);$$('#tl .seg[data-id="'+r.id+'"]').forEach(s=>{s.className='seg '+segClass(r)+(s.classList.contains('cl')?' cl':'')+(s.classList.contains('cr')?' cr':'')+' cur';s.firstChild.textContent=t||(isNoSong(r)?'—':'#'+r.n)});
 const li=$('#list .srow[data-id="'+r.id+'"]');if(li){const b=li.querySelector('.st b');b.textContent=t||(isNoSong(r)?'Not a song':'Unnamed');b.className=t?'':'un';li.querySelector('.cbar').className='cbar '+segClass(r)}
 if(cardFor==r.id){const cb=$('#card .ch b');if(cb){cb.textContent=t||'Unnamed';cb.className=t?'':'un'}}
 const rs=cur.rows;$('#progT').textContent=rs.filter(title).length+' / '+rs.length+' named';$('#lhN').textContent=rs.filter(title).length+' named';
 $('#t2').textContent=$('#t2b').textContent=rs.filter(title).length+' of '+rs.length+' named'}
function merge(r,withNext){const nx=r.next,rs=cur.rows,prev=rs[r.i-1];const other=withNext?nx:prev;if(!other)return;
 const a=withNext?r:prev,b=withNext?nx:r;
 if(!confirm('Join #'+a.n+' and #'+b.n+' into one song? #'+b.n+'’s name and notes are hidden, not deleted (Undo brings them back).'))return;
 snap();const s=sd(cur.d);if(b.user)s.add=s.add.filter(x=>x.id!=b.id);else s.del.push(b.id);saveS();flashSaved();refresh();flashSeg(a.id);toast('Joined into #'+a.n)}
function delSplit(r){if(!r.user)return;if(!confirm('Remove this cut? Its time joins the song before it.'))return;
 snap();const s=sd(cur.d);s.add=s.add.filter(a=>a.id!=r.id);delete s.mv[r.id];saveS();flashSaved();refresh();toast('Cut removed')}
function resetSunday(){const s=S[cur.d];if(!s||!(s.add.length||s.del.length||Object.keys(s.mv).length||s.end!=null))return toast('No cut changes on this Sunday');
 if(!confirm('Put this Sunday’s cuts back to the original marks? Names and lyrics stay.'))return;snap();delete S[cur.d];saveS();flashSaved();refresh();toast('Cuts reset')}

/* ---- Current song card ---- */
function timeRow(get,set){const inp=h('input',{value:fmt(get()),inputMode:'numeric',onchange:()=>{const t=sec(inp.value);if(isNaN(t)){inp.value=fmt(get());return toast('Use mm:ss, like 14:45')}if(!set(t))inp.value=fmt(get())}});
 const mk=(lab,d)=>h('button',{text:lab,onclick:()=>{if(!set(get()+d))inp.value=fmt(get())}});
 return h('div',{class:'tr'},mk('−5',-5),mk('−1',-1),inp,mk('+1',1),mk('+5',5))}
function chips(r,f,opts){const w=h('div',{class:'chips'});opts.forEach(o=>{const c=h('button',{class:'chip l'+(val(r,f)==o?' on':''),text:o,onclick:()=>{setv(r,f,val(r,f)==o?'':o);[...w.children].forEach(x=>x.classList.toggle('on',x.textContent==val(r,f)));
  if(f=='type'){refresh()}}});w.append(c)});return w}
function buildCard(full){if(!cur)return;const r=curSec(),t=title(r),card=$('#card');card.style.setProperty('--c',isNoSong(r)?'#3a4668':gel(r.i));
 const cb=$('#cbTitle');if(document.activeElement!=cb||full){cb.value=t;cbFor=r.id}cardFor=r.id;cardStale=false;
 const cbr=cur.rows.find(x=>x.id==cbFor)||r;$('#cbDot').style.setProperty('--c',isNoSong(cbr)?'#3a4668':gel(cbr.i));
 const open=[...card.querySelectorAll('details')].map(d=>d.open);
 card.replaceChildren(
  h('div',{class:'ch'},h('b',{class:t?'':'un',text:t||'Unnamed',onclick:()=>cb.focus()}),h('span',{text:'#'+r.n+'  '+fmt(r.s)+'–'+fmt(r.e)+'  ('+dur(r)+')'})),
  r.first_line?h('q',{text:r.first_line}):null,
  h('div',{class:'why',text:(r.confidence=='you'?'Cut by you':'Auto-cut, '+r.confidence+' confidence')+(r.mark_reason&&r.confidence!='you'?' — '+r.mark_reason:'')}),
  chips(r,'language',['English','Luganda','Mixed']),chips(r,'type',['Praise','Worship','Not a song']),
  h('div',{class:'fine'},h('label',{text:'Starts'}),timeRow(()=>r.s,x=>setStart(r,x)),h('label',{text:'Ends'}),timeRow(()=>r.e,x=>setEnd(r,x))),
  h('details',{open:open[0]||false},h('summary',{text:'Lyrics and notes'}),
   h('textarea',{rows:6,placeholder:'Lyrics (Verse… / Chorus…)',value:val(r,'lyrics'),oninput:function(){setv(r,'lyrics',this.value)}}),
   h('textarea',{rows:2,placeholder:'Notes',value:val(r,'notes'),oninput:function(){setv(r,'notes',this.value)}}),
   r.heard?h('details',{open:open[1]||false},h('summary',{text:'What the transcriber heard'}),h('div',{class:'heard',text:r.heard.split(' / ').join('\n')})):null),
  h('div',{class:'acts'},
   r.i>0?h('button',{class:'btn sm ghost',text:'Join with #'+(r.n-1),onclick:()=>merge(r,false)}):null,
   r.next?h('button',{class:'btn sm ghost',text:'Join with #'+(r.n+1),onclick:()=>merge(r,true)}):null,
   r.user?h('button',{class:'btn sm danger',text:'Remove this cut',onclick:()=>delSplit(r)}):null,
   h('a',{class:'btn sm ghost',href:ytAt(r.yt,r.s),target:'_blank',rel:'noopener',text:'Open on YouTube'})));
 const rs=cur.rows;$('#progT').textContent=rs.filter(title).length+' / '+rs.length+' named';$('#lhN').textContent=rs.filter(title).length+' named';
 $('#t2').textContent=$('#t2b').textContent=rs.filter(title).length+' of '+rs.length+' named'}
function buildList(){const l=$('#list');l.replaceChildren();cur.rows.forEach(r=>{const row=songRow(r,false);row.onclick=()=>seek(r.s,true);
 row.insertBefore(h('span',{class:'n',text:'#'+r.n}),row.children[1]);l.append(h('li',null,row))})}

/* ========= Keyboard ========= */
document.addEventListener('keydown',e=>{if(view!='studio'||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
 const k=e.key;if(k==' '){e.preventDefault();togglePlay()}else if(k=='ArrowLeft'){seek(T-(e.shiftKey?60:5),playing)}else if(k=='ArrowRight'){seek(T+(e.shiftKey?60:5),playing)}
 else if(k=='c'||k=='C')cutAt(T);else if(k=='e'||k=='E')setEnd(curSec(),T);else if(k=='s'||k=='S')setStart(curSec(),T);else if((k=='z'||k=='Z')&&(e.ctrlKey||e.metaKey))undo()});

/* ========= Menu sheet: backup, restore, export (unchanged formats) ========= */
const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function exportCSV(){const c=['date','song_no','start','end','title','language','type','notes','lyrics','first_line','mark_reason','confidence','youtube_url_with_t'];
 const t=[c.join(',')].concat(allRows().map(r=>[r.date,r.n,fmt(r.s),fmt(r.e),val(r,'title'),val(r,'language'),val(r,'type'),val(r,'notes'),val(r,'lyrics'),r.first_line,r.mark_reason,r.confidence,r.yt].map(q).join(','))).join('\n');
 dl(new Blob([t],{type:'text/csv'}),'mfgc-song-timeline-edited.csv');toast('CSV exported')}
async function copyEdits(){const rs=allRows().filter(r=>r.user||(E[r.id]&&Object.values(E[r.id]).some(x=>x)));
 const t=['date,#,start,end,title,lang,type,notes,lyrics'].concat(rs.map(r=>[r.date,r.n,fmt(r.s),fmt(r.e),val(r,'title'),val(r,'language'),val(r,'type'),val(r,'notes'),val(r,'lyrics')].map(q).join(','))).join('\n');
 try{await navigator.clipboard.writeText(t);toast(rs.length+' edited rows copied')}catch(e){prompt('Copy this:',t)}}
function backup(){const t=JSON.stringify({app:'mfgc-song-timeline',saved:new Date().toISOString(),edits:E,splits:S},null,1);
 dl(new Blob([t],{type:'application/json'}),'mfgc-timeline-backup-'+new Date().toISOString().slice(0,10)+'.json');toast('Backup saved')}
function dl(blob,name){const a=h('a',{href:URL.createObjectURL(blob),download:name});document.body.append(a);a.click();a.remove()}
$('#rf').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j.edits)throw 0;
 if(!confirm('Restore this backup? It replaces what is on this phone now ('+Object.keys(j.edits).length+' edited rows in backup).'))return;
 localStorage.setItem(K+'-before-restore',JSON.stringify(E));localStorage.setItem(SK+'-before-restore',JSON.stringify(S));
 E=j.edits;S=j.splits||{};save();saveS();if(cur)refresh();go(view=='studio'?'home':view);toast('Backup restored')}catch(e){toast('That file is not a timeline backup')}ev.target.value=''};
function openSheet(){const sh=$('#sheet'),studio=view=='studio';
 sh.replaceChildren(h('div',{class:'grip'}),h('h3',{text:studio?'This Sunday and your edits':'Your edits'}),
  h('p',{text:'Everything you change saves on this phone by itself. Backup makes a file you can send to someone, and Restore loads one.'}),
  studio?h('button',{class:'btn ghost',text:'↺  Reset this Sunday’s cuts',onclick:()=>{closeSheet();resetSunday()}}):null,
  h('button',{class:'btn',text:'⤓  Backup to a file',onclick:()=>{closeSheet();backup()}}),
  h('button',{class:'btn',text:'⤒  Restore from a file',onclick:()=>{closeSheet();$('#rf').click()}}),
  h('button',{class:'btn ghost',text:'Export all songs as CSV',onclick:()=>{closeSheet();exportCSV()}}),
  h('button',{class:'btn ghost',text:'Copy my edits as text',onclick:()=>{closeSheet();copyEdits()}}),
  h('div',{class:'note',text:'Keys: space plays, ← → skip 5s (shift: 1 min), C cuts, S and E set start and end.'}));
 sh.classList.add('on');$('#sheetbg').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on');$('#sheetbg').classList.remove('on')}
$('#menu').onclick=$('#menu2').onclick=openSheet;$('#sheetbg').onclick=closeSheet;

/* ========= Start ========= */
go('home');
</script>
</body>
